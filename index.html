<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/script.js" defer></script>
    <link rel="stylesheet" href="./style.css" />

    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="display">0</div>
      <div class="btnContainer">
        <div class="btns">
          <button class="clear" id="ac">AC</button>
          <button class="backspace" id="del">⌫</button>
          <button class="percent" id="percent">%</button>
          <button class="operator" id="div">÷</button>
        </div>

        <div class="btns">
          <button class="num" id="7">7</button>
          <button class="num" id="8">8</button>
          <button class="num" id="9">9</button>
          <button class="operator" id="Multiply">x</button>
        </div>
        <div class="btns">
          <button class="num" id="4">4</button>
          <button class="num" id="5">5</button>
          <button class="num" id="6">6</button>
          <button class="operator" id="substra">-</button>
        </div>
        <div class="btns">
          <button class="num" id="1">1</button>
          <button class="num" id="2">2</button>
          <button class="num" id="3">3</button>
          <button class="operator" id="add">+</button>
        </div>
        <div class="btns">
          <button class="num" id="0">0</button>
          <button id="period">.</button>
          <button id="invert">+/-</button>
          <button class="equal" id="equal">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
