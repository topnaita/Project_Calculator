<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/script.js" defer></script>
    <link rel="stylesheet" href="./style.css" />

    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="display">0</div>
      <div class="btnContainer">
        <div class="btns">
          <button>AC</button>
          <button>⌫</button>
          <button>%</button>
          <button>÷</button>
        </div>

        <div class="btns">
          <button class="itemNum1" id="7">7</button>
          <button class="itemNum1" id="8">8</button>
          <button class="itemNum1" id="9">9</button>
          <button class="itemNum1">x</button>
        </div>
        <div class="btns">
          <button class="itemNum4" id="4">4</button>
          <button class="itemNum5" id="5">5</button>
          <button class="itemNum6" id="6">6</button>
          <button class="itemNum7">-</button>
        </div>
        <div class="btns">
          <button class="itemNum1" id="1">1</button>
          <button class="itemNum2" id="2">2</button>
          <button class="itemNum3" id="3">3</button>
          <button class="oprSum">+</button>
        </div>
        <div class="btns">
          <button class="itemNum1" id="0">0</button>
          <button>.</button>
          <button>+/-</button>
          <button class="itemResult">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
